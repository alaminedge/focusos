name: Build Focus OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Mobile uploads cannot create folders, so "a__b__c.kt" becomes "a/b/c.kt".
      - name: Restore folders from flat file names
        shell: bash
        run: |
          shopt -s nullglob
          for f in *__*; do
            [ -f "$f" ] || continue
            target="${f//__//}"
            mkdir -p "$(dirname "$target")"
            mv "$f" "$target"
          done
          find app -type f | sort

      - name: Generate settings, properties and resources
        shell: bash
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FocusOS"
          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          R=app/src/main/res
          mkdir -p $R/values $R/values-night $R/drawable $R/mipmap-anydpi-v26

          cat > $R/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Focus OS</string>
          </resources>
          EOF

          cat > $R/values/colors.xml <<'EOF'
          <resources>
              <color name="window_bg">#FFF7FAF8</color>
              <color name="ic_bg">#FF0F8F69</color>
          </resources>
          EOF

          cat > $R/values-night/colors.xml <<'EOF'
          <resources>
              <color name="window_bg">#FF0E1512</color>
          </resources>
          EOF

          cat > $R/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.FocusOS" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/window_bg</item>
              </style>
          </resources>
          EOF

          cat > $R/values-night/themes.xml <<'EOF'
          <resources>
              <style name="Theme.FocusOS" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/window_bg</item>
              </style>
          </resources>
          EOF

          cat > $R/drawable/ic_launcher_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="6"
                  android:strokeLineCap="round"
                  android:pathData="M54,54m-24,0a24,24 0,1 1,48 0a24,24 0,1 1,-48 0" />
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M54,54m-9,0a9,9 0,1 1,18 0a9,9 0,1 1,-18 0" />
          </vector>
          EOF

          cat > $R/drawable/ic_stat.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="2.4"
                  android:pathData="M12,12m-8,0a8,8 0,1 1,16 0a8,8 0,1 1,-16 0" />
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,12m-3,0a3,3 0,1 1,6 0a3,3 0,1 1,-6 0" />
          </vector>
          EOF

          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF

      # A fixed signing key means every build can be installed over the previous one
      # without uninstalling, so your study history is never wiped by an update.
      - name: Install stable signing key
        shell: bash
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Prints the signing fingerprint. It must be identical in every run;
      # if it is, each new APK installs over the old one and keeps your data.
      - name: Show signing fingerprint
        run: keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i -E "androiddebugkey|fingerprint"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FocusOS-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FocusOS-APK
          path: FocusOS-${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Focus OS build ${{ github.run_number }}
          files: FocusOS-${{ github.run_number }}.apk
          make_latest: true
